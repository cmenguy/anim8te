[project]
name = "gvhmr-worker"
version = "0.1.0"
description = "FastAPI wrapper around GVHMR's demo: video in, hmr4d_results.pt and overlay out"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.scripts]
gvhmr-worker = "gvhmr_worker.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gvhmr_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
