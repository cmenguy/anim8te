[project]
name = "motionai"
version = "0.1.0"
description = "AI pipeline from one image and a prompt to game-ready humanoid animations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
motionai = "motionai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motionai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# one-off M0 scripts and the plan tooling are not part of the package
extend-exclude = ["docs/scratch", ".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
